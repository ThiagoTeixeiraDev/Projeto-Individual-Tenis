<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./../css/quiz.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@300..700&display=swap"
        rel="stylesheet">
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>
</head>

<body onload="onloadEsconder()">

    <div class="header-left">
        <div class="sidebar-topo">
            <img src="../assets/imgs/logo.png" alt="Logo TMT Tênis">
            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>
        </div>

        <div class="sidebar-nav">
            <a href="../quiz.html" class="btn-nav">
                <h3>Quiz 1x1</h3>
            </a>
            <a href="./dashboard.html" class="btn-nav ativo">
                <h3>Gráficos</h3>
            </a>
        </div>

        <div class="btn-logout" onclick="window.location.href = '../login.html'">
            <h3>Sair</h3>
        </div>
    </div>


    <div class="quiz" id="pontuacaoEJogo">

        <div class="quiz-banner quadra">
            <div>
                <h1>Quiz Tênis</h1>
                <p>Vamos ver até onde você sabe sobre tênis.</p>
            </div>
            <div class="placar-topo" id="pontuacao">
                <div class="box-placar">
                    <span>Acertos</span>
                    <strong id="spanCertas">0</strong>
                </div>
                <div class="box-placar">
                    <span>Erros</span>
                    <strong id="spanErradas">0</strong>
                </div>
                <div class="box-placar destaque-amarelo">
                    <span>Pontuação</span>
                    <strong id="spanPontuacao">0 pts</strong>
                </div>
            </div>
        </div>

        <button id="btnIniciarQuiz" class="btn-iniciar" onclick="iniciarQuiz()">INICIAR QUIZ</button>

        <div id="progresso" class="progresso-container">
            <div class="progresso-barra" id="barra_progresso"></div>
        </div>

        <section class="quiz-card" id="tela_pergunta">
            <div class="quiz-card-topo" id="jogo">
                <span>Questão Atual</span><span class="badge-tema" id="spanNumeroDaQuestaoAtual">de <span
                        id="qtdQuestoes"></span>
                    <span class="valor-questao">+100 pts</span>
            </div>


            <h2 id="spanQuestaoExibida" class="enunciado"></h2>

            <div class="opcoes-grid" id="opcoes">
                <span>
                    <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA" />
                    <label for="primeiraOpcao" class="option" id="labelOpcaoUm">
                        <span class="opcao-letra">A</span>
                        <span id="textoOpcaoUm"></span>
                    </label>
                </span>

                <span>
                    <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB" />
                    <label for="segundaOpcao" class="option" id="labelOpcaoDois">
                        <span class="opcao-letra">B</span>
                        <span id="textoOpcaoDois"></span>
                    </label>
                </span>

                <span>
                    <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC" />
                    <label for="terceiraOpcao" class="option" id="labelOpcaoTres">
                        <span class="opcao-letra">C</span>
                        <span id="textoOpcaoTres"></span>
                    </label>
                </span>

                <span>
                    <input type="radio" id="quartaOpcao" name="option" class="radio" value="alternativaD" />
                    <label for="quartaOpcao" class="option" id="labelOpcaoQuatro">
                        <span class="opcao-letra">D</span>
                        <span id="textoOpcaoQuatro"></span>
                    </label>
                </span>
            </div>
            <div id="boxFeedback" class="feedback-box">
                <p id="textoFeedback"></p>
            </div>

            <div id="botoes" class="botoes">
                <button onclick="submeter()" id="btnSubmeter" class="btn-iniciar">Confirmar resposta</button>
                <button onclick="avancar()" id="btnProx" class="btn-proximo" disabled>Próxima Bola →</button>
            </div>

            <div id="pontuacaoFinalJogo" class="quiz-card resultado-card">
                <span class="tag-quadra">FIM DE JOGO · GAME, SET & MATCH!</span>
                <h2 id="tituloFinal"></h2>
                <p id="msgFinal" class="subtitulo-resultado"></p>

                <div class="resumo-grid">
                    <div class="resumo-item">
                        <span>Acertos</span>
                        <strong id="spanAcertosFinal"></strong>
                    </div>
                    <div class="resumo-item destaque-amarelo">
                        <span>Pontuação Final</span>
                        <strong id="spanPontuacaoFinal"></strong>
                    </div>
                    <div class="resumo-item">
                        <span>Aproveitamento</span>
                        <strong id="spanTaxaFinal"></strong>
                    </div>
                </div>

                <div class="acoes-resultado">
                    <button onclick="tentarNovamente()" id="btnTentarNovamente" class="btn-reiniciar">Jogar
                        Novamente</button>
                    <a href="./dashboard.html" class="btn-ver-graficos">Ver nos Gráficos</a>
                </div>
            </div>

    </div>


    </div>



</body>

</html>

<script>
    const btnSubmeter = document.getElementById("btnSubmeter")
    const btnProx = document.getElementById("btnProx")

    const PONTOS_POR_ACERTO = 100

    const listaDeQuestoes = [

        {
            pergunta: "Qual é a sequência correta de pontos dentro de um game tradicional no tênis?",
            alternativaA: "10, 20, 30, Game",
            alternativaB: "15, 30, 40, Game",
            alternativaC: "15, 25, 50, Game",
            alternativaD: "1, 2, 3, Game",
            alternativaCorreta: "alternativaB",
            explicacao: "A contagem tradicional de um game é 0, 15, 30, 40 e o ponto seguinte fecha o game."
        },

        {
            pergunta: "Quando o placar de um game chega empatado em 40 a 40, como esse momento é chamado?",
            alternativaA: "Tie-break",
            alternativaB: "Match point",
            alternativaC: "Deuce (iguais)",
            alternativaD: "Let",
            alternativaCorreta: "alternativaC",
            explicacao: "O empate em 40-40 é chamado de Deuce. Depois dele, o jogador precisa fazer vantagem e mais um ponto."
        },

        {
            pergunta: "Em qual superfície é disputado o torneio de Roland Garros, na França?",
            alternativaA: "Saibro (terra batida)",
            alternativaB: "Grama",
            alternativaC: "Quadra rápida (asfáltica)",
            alternativaD: "Carpete indoor",
            alternativaCorreta: "alternativaA",
            explicacao: "Roland Garros é jogado no saibro, um piso mais lento que deixa as trocas de bola mais longas."
        },

        {
            pergunta: "O que acontece quando a bola sacada toca a fita superior da rede e cai na área certa?",
            alternativaA: "Ponto direto para quem sacou",
            alternativaB: "Falta dupla automática",
            alternativaC: "Ponto para o adversário",
            alternativaD: "Let — o saque é repetido sem penalidade",
            alternativaCorreta: "alternativaD",
            explicacao: "Quando encosta na rede e cai certo, dá 'Let' e o saque é repetido."
        },

        {
            pergunta: "Quantos games um jogador precisa vencer (com 2 de diferença) para ganhar um set padrão?",
            alternativaA: "4 games",
            alternativaB: "5 games",
            alternativaC: "6 games",
            alternativaD: "8 games",
            alternativaCorreta: "alternativaC",
            explicacao: "Um set comum vai até 6 games (por exemplo, 6-4)."
        },

        {
            pergunta: "Como é chamado o golpe dado antes de a bola quicar no chão, perto da rede?",
            alternativaA: "Voleio",
            alternativaB: "Lob",
            alternativaC: "Drop shot",
            alternativaD: "Slice",
            alternativaCorreta: "alternativaA",
            explicacao: "O voleio é feito no ar, antes de a bola quicar no piso."
        }

    ]

    // variáveis globais    
    let numeroDaQuestaoAtual = 0
    let pontuacaoFinal = 0
    let certas = 0
    let erradas = 0
    let quantidadeDeQuestoes = listaDeQuestoes.length
    // let isUltima = numeroDaQuestaoAtual == quantidadeDeQuestoes-1 ? true : false

    function onloadEsconder() {
        document.getElementById('pontuacao').style.display = "none"
        document.getElementById('progresso').style.display = "none"
        document.getElementById('jogo').style.display = "none"
        document.getElementById('pontuacaoFinalJogo').style.display = "none"
    }

    function iniciarQuiz() {
        document.getElementById('pontuacao').style.display = "flex"
        document.getElementById('progresso').style.display = "block"
        document.getElementById('jogo').style.display = "flex"
        document.getElementById('btnIniciarQuiz').style.display = "none"

        document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes

        preencherHTMLcomQuestaoAtual(0)

        btnSubmeter.disabled = false
        btnProx.disabled = true
        // btnConcluir.disabled = true
    }

    function preencherHTMLcomQuestaoAtual(index) {
        habilitarAlternativas(true)
        const questaoAtual = listaDeQuestoes[index]
        numeroDaQuestaoAtual = index
        console.log("questaoAtual")
        console.log(questaoAtual)
        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta
        document.getElementById("textoOpcaoUm").innerHTML = questaoAtual.alternativaA
        document.getElementById("textoOpcaoDois").innerHTML = questaoAtual.alternativaB
        document.getElementById("textoOpcaoTres").innerHTML = questaoAtual.alternativaC
        document.getElementById("textoOpcaoQuatro").innerHTML = questaoAtual.alternativaD
        document.getElementById("barra_progresso").style.width = ((index + 1) / quantidadeDeQuestoes) * 100 + "%"
    }

    function submeter() {
        const options = document.getElementsByName("option"); // recupera alternativas no html

        let hasChecked = false
        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) {
                hasChecked = true
                break
            }
        }

        if (!hasChecked) {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
        } else {
            btnSubmeter.disabled = true
            btnProx.disabled = false

            habilitarAlternativas(false)

            checarResposta()
        }
    }

    function habilitarAlternativas(trueOrFalse) {
        let opcaoEscolhida = trueOrFalse ? false : true

        primeiraOpcao.disabled = opcaoEscolhida
        segundaOpcao.disabled = opcaoEscolhida
        terceiraOpcao.disabled = opcaoEscolhida
        quartaOpcao.disabled = opcaoEscolhida

    }

    function avancar() {
        btnProx.disabled = true
        btnSubmeter.disabled = false

        desmarcarRadioButtons()
        limparCoresBackgroundOpcoes()
        document.getElementById("boxFeedback").style.display = "none"

        if (numeroDaQuestaoAtual < quantidadeDeQuestoes) {
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else {
            finalizarJogo()
        }
    }

    function tentarNovamente() {
        // atualiza a página
        window.location.reload()
    }

    function checarResposta() {
        const boxFeedback = document.getElementById("boxFeedback")
        const textoFeedback = document.getElementById("textoFeedback")
        const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual] // questão atual 
        const respostaQuestaoAtual = questaoAtual.alternativaCorreta // qual é a resposta correta da questão atual

        const options = document.getElementsByName("option"); // recupera alternativas no html

        let alternativaCorreta = null // variável para armazenar a alternativa correta

        options.forEach((option) => {
            if (option.value === respostaQuestaoAtual) {
                alternativaCorreta = option.labels[0].id
            }
        })

        // verifica se resposta assinalada é correta
        options.forEach((option) => {
            if (option.checked === true && option.value === respostaQuestaoAtual) {
                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                pontuacaoFinal += PONTOS_POR_ACERTO
                certas++
                document.getElementById("spanCertas").innerHTML = certas
                document.getElementById("spanPontuacao").innerHTML = pontuacaoFinal + " pts"

                boxFeedback.className = "feedback-box acerto"
                textoFeedback.innerHTML = "<b>Ponto seu!</b> " + questaoAtual.explicacao
                numeroDaQuestaoAtual++
            } else if (option.checked && option.value !== respostaQuestaoAtual) {
                const wrongLabelId = option.labels[0].id

                document.getElementById(wrongLabelId).classList.add("text-danger-with-bg")
                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                erradas++
                document.getElementById("spanErradas").innerHTML = erradas

                boxFeedback.className = "feedback-box erro"
                textoFeedback.innerHTML = "<b>Bola fora!</b> " + questaoAtual.explicacao
                numeroDaQuestaoAtual++
            }
        })

        if (numeroDaQuestaoAtual == quantidadeDeQuestoes) {
            btnProx.innerHTML = "Finalizar Partida"
        } else {
            btnProx.innerHTML = "Próxima Bola →"
        }

    }




    function limparCoresBackgroundOpcoes() {
        const options = document.getElementsByName("option");
        options.forEach((option) => {
            document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
            document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
        })
    }

    function desmarcarRadioButtons() {
        const options = document.getElementsByName("option");
        for (let i = 0; i < options.length; i++) {
            options[i].checked = false;
        }
    }

    function finalizarJogo() {
        const porcentagemFinalDeAcertos = certas / quantidadeDeQuestoes
        const aproveitamento = Math.round(porcentagemFinalDeAcertos * 100)

        let tituloParaMensagemFinal = null
        let textoParaMensagemFinal = null

        if (aproveitamento >= 70) {
            tituloParaMensagemFinal = "Vitória na Quadra!"
            textoParaMensagemFinal = "Mandou bem! Você conhece bem as regras básicas do tênis."
        } else {
            tituloParaMensagemFinal = "Bom treino!"
            textoParaMensagemFinal = "Continue treinando as regras para melhorar sua pontuação."
        }



        document.getElementById("barra_progresso").style.width = "100%"
        document.getElementById("tituloFinal").innerHTML = tituloParaMensagemFinal
        document.getElementById("msgFinal").innerHTML = textoParaMensagemFinal
        document.getElementById("spanAcertosFinal").innerHTML = certas + " / " + quantidadeDeQuestoes
        document.getElementById("spanPontuacaoFinal").innerHTML = pontuacaoFinal + " pts"
        document.getElementById("spanTaxaFinal").innerHTML = aproveitamento + "%"

        document.getElementById("jogo").style.display = "none"
        document.getElementById("pontuacaoFinalJogo").style.display = "flex"

    }
</script>
