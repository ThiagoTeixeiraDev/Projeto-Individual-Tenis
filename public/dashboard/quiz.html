<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./../css/quiz.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@300..700&display=swap"
        rel="stylesheet">
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>
</head>

<body>

    <div class="header-left">
        <div class="sidebar-topo">
            <img src="../assets/imgs/logo.png" alt="Logo TMT Tênis">
            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>
        </div>

        <div class="sidebar-nav">
            <a href="../quiz.html" class="btn-nav">
                <h3>Quiz 1x1</h3>
            </a>
            <a href="./dashboard.html" class="btn-nav ativo">
                <h3>Gráficos</h3>
            </a>
        </div>

        <div class="btn-logout" onclick="sair()">
            <h3>Sair</h3>
        </div>
    </div>


    <div class="quiz">

        <div class="quiz-banner quadra">
            <div>
                <h1>Quiz Tênis</h1>
                <p>Vamos ver até onde você sabe sobre tênis.</p>
            </div>
            <div class="placar-topo">
                <div class="box-placar">
                    <span>Questão</span>
                    <strong id="indicador_questao">1 / 6</strong>
                </div>
                <div class="box-placar destaque-amarelo">
                    <span>Pontuação</span>
                    <strong id="placar_atual">0 pts</strong>
                </div>
            </div>
        </div>

        <div class="progresso-container">
            <div class="progresso-barra" id="barra_progresso"></div>
        </div>

        <section class="quiz-card" id="tela_pergunta">
            <div class="quiz-card-topo">
                <span class="badge-tema" id="categoria_pergunta">Regras Básicas</span>
                <span class="valor-questao">+100 pts</span>
            </div>

            <h2 class="enunciado" id="texto_pergunta">Pergunta</h2>

            <div class="opcoes-grid">
          <button class="opcao-btn" id="btn_opcao_0" onclick="verificarResposta(0)">
            <span class="opcao-letra">A</span>
            <span class="opcao-texto" id="texto_opcao_0">Opção A</span>
          </button>

          <button class="opcao-btn" id="btn_opcao_1" onclick="verificarResposta(1)">
            <span class="opcao-letra">B</span>
            <span class="opcao-texto" id="texto_opcao_1">Opção B</span>
          </button>

          <button class="opcao-btn" id="btn_opcao_2" onclick="verificarResposta(2)">
            <span class="opcao-letra">C</span>
            <span class="opcao-texto" id="texto_opcao_2">Opção C</span>
          </button>

          <button class="opcao-btn" id="btn_opcao_3" onclick="verificarResposta(3)">
            <span class="opcao-letra">D</span>
            <span class="opcao-texto" id="texto_opcao_3">Opção D</span>
          </button>
        </div>
    </div>



</body>

</html>
