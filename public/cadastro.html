<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TMT Tênis | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/cadastro-login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@300..700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="header">
    <div class="paginas">
      <ul class="horizontal">
        <li><a href="index.html">Página Inicial</a></li>
        <li><a href="sobre.html">Sobre o Tênis</a></li>
      </ul>
    </div>
    <div class="logo-header">
      <img src="../public/assets/imgs/logo.png" alt="">
    </div>
    <div class="cadastro">
      <ul class="horizontal">
        <li><a href="login.html">Login</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </div>
  </div>

  <div class="auto quadra">
    <div class="card-auto">
      <h2>Bem-Vindo!</h2>
      <div class="formulario">

        <div class="campo">
          <span>Nome:</span>
          <input id="ipt_nome" type="text" placeholder="Digite seu nome completo">
        </div>
        <div class="campo">
          <span>E-mail:</span>
          <input id="ipt_email" type="text" placeholder="Digite seu email">
        </div>
        <div class="campo">
          <span>Senha:</span>
          <input id="ipt_senha" type="password" placeholder="Digite sua senha" onkeyup="aviso()">
          <div id="div_msg"></div>
        </div>
        <div class="campo">
          <span>Confirme a senha:</span>
          <input id="ipt_conf_senha" type="password" placeholder="Confirme a sua senha">
        </div>
        <button class="btn" onclick="cadastrar()">
          Cadastrar
        </button>
      </div>
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
      <div id="div_aguardar" class="carregando_div">
        <img src="" alt="">
      </div>
      <div id="div_erros_login"></div>
    </div>
  </div>
  <div class="rodape">
    <p>TMT Tênis · Projeto Individual · Thiago Menezes Teixeira · São Paulo Tech School - Ciência da Computação · 2026
    </p>
  </div>
</body>

</html>

<script>


  function aviso() {

    div_msg.innerHTML = `A senha deve ter:<br>
    - Um número (1, 2, 3...)<br>
    - Uma letra maiúscula<br>
    - Mínimo de 8 caracteres`

  }



  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {

    // aguardar();


    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = ipt_nome.value;
    var emailVar = ipt_email.value;
    var senhaVar = ipt_senha.value;
    var confirmacaoSenhaVar = ipt_conf_senha.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Preencha o campo que está vazio";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    var tamanhoOk = senhaVar.length >= 8;
    var temMaiuscula = senhaVar != senhaVar.toLowerCase();

    if (!tamanhoOk || !temMaiuscula) {
      var mensagem = "A senha precisa ter:\n";
      if (!tamanhoOk) {
        mensagem += "- No mínimo 8 caracteres\n";
      }
      if (!temMaiuscula) {
        mensagem += "- Uma letra maiúscula\n";
      }
      alert(mensagem);
      return false;
    }

    if (senhaVar != confirmacaoSenhaVar) {
      alert("As senhas não coincidem.");
      return false;
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
